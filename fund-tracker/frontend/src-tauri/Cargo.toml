[package]
name = "fund-tracker"
version = "3.0.0"
description = "Fund Tracker Android shell with an embedded local API"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fund_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fund-backend = { path = "plugins/fund-backend" }
